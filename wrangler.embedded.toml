# Live deploy config: https://jeri.fullstuckengineer.workers.dev (page files built into the Worker).
# Update: CLOUDFLARE_API_TOKEN=... npx wrangler deploy -c wrangler.embedded.toml
# The Gemini key is NOT here: add it in the dashboard as a Secret named GEMINI_API_KEY.
name = "jeri"
main = "worker/embedded.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]
# Public URL https://fullstuckengineer.<your-subdomain>.workers.dev (on every deploy) + preview URLs
workers_dev = true
preview_urls = true

["/api/*"]

# KV (saved analyses + voice clips). Optional: Jeri works without it, but saving clips protects the free voice quota.
# To add: Cloudflare dashboard → Storage & Databases → KV → Create "JERI_KV" → copy its ID, then uncomment:
# [[kv_namespaces]]
# binding = "JERI_KV"
# id = "<KV namespace ID>"

[vars]
TTS_ENGINE = "gemini-only"

[observability]
enabled = true

[[kv_namespaces]]
binding = "JERI_KV"
id = "326e0e9aca5a44b39bb8b772f3054ae7"

# Page files are imported as text by worker/embedded.js
[[rules]]
type = "Text"
globs = ["**/public/*.html", "**/public/*.css", "**/public/*.js"]
fallthrough = false
