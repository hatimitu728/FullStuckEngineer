# Jeri on Cloudflare Workers (free plan). Deploy: see docs/deploy-cloudflare.md
name = "jeri"
main = "worker/index.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "none"
run_worker_first = ["/api/*"]

# Created with: npx wrangler kv namespace create JERI_KV  (then paste the id here)
[[kv_namespaces]]
binding = "JERI_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[vars]
TTS_ENGINE = "gemini-only"

[observability]
enabled = true
